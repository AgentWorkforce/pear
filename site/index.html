<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pear</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7f4;
        color: #14201c;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 72px 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, 8vw, 76px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 620px;
        margin: 0 0 24px;
        color: #40534b;
        font-size: 18px;
        line-height: 1.55;
      }

      code,
      pre {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        border: 1px solid #cfdbd2;
        border-radius: 8px;
        background: #ffffff;
        color: #14201c;
      }

      a {
        color: #126b4f;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-top: 28px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101815;
          color: #f2f7f3;
        }

        p {
          color: #b6c7be;
        }

        pre {
          border-color: #2e443a;
          background: #17231e;
          color: #f2f7f3;
        }

        a {
          color: #6ee0b6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pear</h1>
      <p>Desktop control surface for Agent Relay.</p>
      <pre><code>curl -fsSL https://pear.agentrelay.com/install.sh | sh</code></pre>
      <pre><code>wget -qO- https://pear.agentrelay.com/install.sh | sh</code></pre>
      <div class="links">
        <a href="/install.sh">macOS/Linux installer script</a>
        <a href="/install.ps1">Windows PowerShell installer</a>
        <a href="https://github.com/AgentWorkforce/pear/releases/latest">Latest release</a>
      </div>
    </main>
  </body>
</html>
