appId: com.agentrelay.pear
productName: Pear by Agent Relay
copyright: Copyright © 2026 Agent Workforce Incorporated

directories:
  buildResources: build
  output: dist

# Include the bundled output + production deps; exclude source & config.
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.mjs'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.web.tsbuildinfo}'
  - '!{.env,.env.*,.npmrc}'

asarUnpack:
  - resources/**

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Notarization-required hardening
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder notarizes via notarytool using the
  # APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER env vars.
  notarize: true
  target:
    - target: dmg
      arch: universal

dmg:
  artifactName: ${name}-${version}.${ext}

# No native modules — skip the rebuild step.
npmRebuild: false

publish:
  provider: github
  owner: AgentWorkforce
  repo: pear
  # Upload to a DRAFT release so you review & click "Publish" manually.
  releaseType: draft
