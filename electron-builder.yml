appId: com.agentrelay.pear
productName: Pear by Agent Relay
copyright: Copyright © 2026 Agent Workforce Incorporated

directories:
  buildResources: build
  output: dist

# Include only the bundled app, production deps, and runtime resources.
files:
  - out/**
  - resources/**
  - package.json
  - node_modules/**
  - '!node_modules/.cache/**'

extraResources:
  - from: resources/app-icon.png
    to: app-icon.png
  - from: bin/relayfile-mount
    to: bin/relayfile-mount
  # External MCP clients are normal processes and cannot traverse app.asar.
  # Ship the agent-relay MCP entrypoint and its runtime dependency closure as
  # regular files under Resources/agent-relay-mcp/node_modules.
  - from: node_modules
    to: agent-relay-mcp/node_modules
    filter:
      - agent-relay/**
      - '@agent-relay/**'
      - '@aws/**'
      - '@aws-crypto/**'
      - '@aws-sdk/**'
      - '@esbuild/**'
      - '@hono/node-server/**'
      - '@isaacs/fs-minipass/**'
      - '@modelcontextprotocol/sdk/**'
      - '@nodable/entities/**'
      - '@posthog/**'
      - '@relaycast/**'
      - '@smithy/**'
      - '@xterm/headless/**'
      - accepts/**
      - ajv/**
      - ajv-formats/**
      - asn1/**
      - bcrypt-pbkdf/**
      - body-parser/**
      - bowser/**
      - buildcheck/**
      - bytes/**
      - call-bind-apply-helpers/**
      - call-bound/**
      - chownr/**
      - commander/**
      - compare-versions/**
      - content-disposition/**
      - content-type/**
